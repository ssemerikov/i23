<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>External call</title>
        <script type="module" src="./external_call.js"></script>
    </head>
    <body>
        <h1>External call</h1>
        <label for="inputField">Сума у гривнях:</label>
        <input type="number" id="inputField" placeholder="100">
        <!-- селектор валют: ам. долар, євро, фунт стерлінгів, вон -->
        <select id="currencySelector">
            <option value="usd" default>USD</option>
            <option value="eur">EUR</option>
            <option value="gbp">GBP</option>
            <option value="krw">KRW</option>
        </select>
        <br><br>
        <button id="convertButton">Конвертувати</button>
        <p id="result"></p>
    </body>
</html>
